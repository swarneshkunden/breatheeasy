name: Post-deploy smoke test

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed health and commit
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          EXPECTED_COMMIT: ${{ github.event.deployment.sha }}
        run: |
          node --input-type=module -e '
            const healthUrl = new URL("/api/health", process.env.DEPLOYMENT_URL);
            const response = await fetch(healthUrl);
            if (!response.ok) throw new Error(`Health endpoint returned ${response.status}`);
            const health = await response.json();
            if (health.ai !== "configured") throw new Error("Deployed AI is not configured");
            if (health.commit !== process.env.EXPECTED_COMMIT) {
              throw new Error(`Deployment commit mismatch: expected ${process.env.EXPECTED_COMMIT}, received ${health.commit}`);
            }
            console.log(JSON.stringify(health));
          '
